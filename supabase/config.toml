project_id = "splitcart"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 10000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["splitcart://**", "http://localhost:8081/**"]
jwt_expiry = 3600
[auth.email]
enable_signup = true
enable_confirmations = false
[storage]
enabled = true
file_size_limit = "5MiB"

# Handler verifies user JWTs, Stripe webhook signatures, and scheduler credentials
# separately. The gateway must permit provider webhooks without a Supabase JWT.
[functions.payments]
verify_jwt = false
